[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pipeline_agent"
version = "0.1.0"
description = "Pipeline Leak Detection Agent - AgentCore Runtime"
requires-python = ">=3.10"
dependencies = [
    "bedrock-agentcore >= 1.9.1",
    "strands-agents >= 1.15.0",
    "botocore[crt] >= 1.35.0",
    "pandas >= 2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]
