<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Test Suite — Pipeline Leak Detection</title>
    <style>
        :root {
            --bg: #0f172a; --surface: #1e293b; --surface2: #334155; --border: #475569;
            --text: #f1f5f9; --text-muted: #94a3b8; --accent: #3b82f6;
            --danger: #ef4444; --warning: #f59e0b; --success: #22c55e; --info: #06b6d4;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
        .header {
            background: var(--surface); border-bottom: 1px solid var(--border);
            padding: 16px 24px; display: flex; align-items: center; justify-content: space-between;
        }
        .header h1 { font-size: 20px; font-weight: 600; }
        .header a { color: var(--accent); text-decoration: none; font-size: 14px; }
        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }

        /* Config Panel */
        .config-panel {
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            padding: 20px; margin-bottom: 24px;
        }
        .config-panel h2 { font-size: 16px; margin-bottom: 16px; color: var(--accent); }
        .config-row { display: flex; gap: 16px; align-items: flex-end; flex-wrap: wrap; }
        .config-field { display: flex; flex-direction: column; gap: 6px; }
        .config-field label { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .config-field input, .config-field select {
            background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
            padding: 10px 14px; color: var(--text); font-size: 14px; outline: none; min-width: 140px;
        }
        .config-field input:focus, .config-field select:focus { border-color: var(--accent); }
        .btn {
            padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 14px;
            cursor: pointer; border: none; transition: opacity 0.15s;
        }
        .btn:hover { opacity: 0.9; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-success { background: var(--success); color: #000; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }

        /* Scores Panel */
        .scores-panel {
            display: none; background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; margin-bottom: 24px;
        }
        .scores-panel.active { display: block; }
        .scores-panel h2 { font-size: 16px; margin-bottom: 16px; }
        .scores-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .score-card {
            background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
            padding: 14px; text-align: center;
        }
        .score-card .score-value { font-size: 32px; font-weight: 700; line-height: 1.2; }
        .score-card .score-label { font-size: 11px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; }
        .score-card.good .score-value { color: var(--success); }
        .score-card.warn .score-value { color: var(--warning); }
        .score-card.bad .score-value { color: var(--danger); }
        .score-card.neutral .score-value { color: var(--info); }

        /* Confusion Matrix */
        .confusion-matrix {
            display: grid; grid-template-columns: auto 1fr 1fr; grid-template-rows: auto 1fr 1fr;
            gap: 2px; max-width: 360px; margin: 0 auto; text-align: center; font-size: 14px;
        }
        .cm-header { font-size: 11px; color: var(--text-muted); padding: 8px; text-transform: uppercase; }
        .cm-cell {
            background: var(--bg); border: 1px solid var(--border); border-radius: 6px;
            padding: 16px; font-size: 24px; font-weight: 700;
        }
        .cm-cell.tp { color: var(--success); background: rgba(34,197,94,0.1); }
        .cm-cell.tn { color: var(--success); background: rgba(34,197,94,0.1); }
        .cm-cell.fp { color: var(--danger); background: rgba(239,68,68,0.1); }
        .cm-cell.fn { color: var(--danger); background: rgba(239,68,68,0.1); }
        .cm-label { font-size: 10px; color: var(--text-muted); display: block; margin-top: 4px; font-weight: 400; }

        /* Progress */
        .progress-panel {
            display: none; background: var(--surface); border: 1px solid var(--border);
            border-radius: 12px; padding: 20px; margin-bottom: 24px;
        }
        .progress-panel.active { display: block; }
        .progress-bar-track {
            background: var(--bg); border-radius: 8px; height: 24px; overflow: hidden; margin: 12px 0;
        }
        .progress-bar-fill {
            background: linear-gradient(90deg, var(--accent), var(--info)); height: 100%;
            border-radius: 8px; transition: width 0.3s; display: flex; align-items: center;
            justify-content: center; font-size: 12px; font-weight: 600; min-width: 40px;
        }
        .progress-status { font-size: 13px; color: var(--text-muted); }

        /* Results Table */
        .results-panel {
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            padding: 20px; margin-bottom: 24px;
        }
        .results-panel h2 { font-size: 16px; margin-bottom: 16px; }
        .results-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .results-table th {
            text-align: left; padding: 10px 12px; background: var(--bg); color: var(--text-muted);
            font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
        }
        .results-table td {
            padding: 10px 12px; border-bottom: 1px solid var(--bg); vertical-align: top;
        }
        .results-table tr:hover { background: var(--surface2); }
        .results-table tr.correct { }
        .results-table tr.incorrect { background: rgba(239,68,68,0.05); }

        .badge {
            font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600;
            display: inline-block; text-transform: uppercase;
        }
        .badge.leak { background: var(--danger); color: #fff; }
        .badge.false_positive { background: var(--success); color: #000; }
        .badge.correct { background: var(--success); color: #000; }
        .badge.incorrect { background: var(--danger); color: #fff; }
        .badge.error { background: var(--warning); color: #000; }
        .badge.pending { background: var(--surface2); color: var(--text-muted); }

        /* Detail Modal */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
            z-index: 100; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
            width: 90%; max-width: 800px; max-height: 85vh; overflow-y: auto; padding: 24px;
        }
        .modal h2 { font-size: 18px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
        .modal .close-btn { background: none; border: none; color: var(--text-muted); font-size: 24px; cursor: pointer; }
        .response-block {
            background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
            padding: 16px; margin-top: 12px; font-size: 13px; line-height: 1.6;
            word-wrap: break-word; max-height: 400px; overflow-y: auto;
        }
        .response-block h1, .response-block h2, .response-block h3 {
            font-size: 14px; font-weight: 600; margin: 10px 0 6px; color: var(--accent);
        }
        .response-block strong { color: var(--text); }
        .response-block ul, .response-block ol { padding-left: 18px; margin: 4px 0; }
        .response-block code { background: var(--surface2); padding: 1px 5px; border-radius: 3px; font-size: 12px; }
        .response-block pre { background: var(--surface2); padding: 10px; border-radius: 6px; overflow-x: auto; }
        .response-block table { border-collapse: collapse; width: 100%; margin: 8px 0; font-size: 12px; }
        .response-block th { background: var(--surface2); padding: 6px 10px; text-align: left; border: 1px solid var(--border); }
        .response-block td { padding: 5px 10px; border: 1px solid var(--border); }
        .detail-row { display: flex; gap: 8px; margin-bottom: 6px; }
        .detail-label { color: var(--text-muted); min-width: 140px; font-size: 13px; }
        .detail-value { font-size: 13px; font-weight: 500; }

        .loading-spinner {
            display: inline-block; width: 16px; height: 16px;
            border: 2px solid var(--text-muted); border-top-color: var(--accent);
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="header">
        <h1>Agent Test Suite — Simulated Event Evaluation</h1>
        <a href="./">Back to Dashboard</a>
    </div>

    <div class="container">
        <!-- Config -->
        <div class="config-panel">
            <h2>Test Configuration</h2>
            <div class="config-row">
                <div class="config-field">
                    <label>Number of Events</label>
                    <input type="number" id="num-events" value="12" min="4" max="30">
                </div>
                <div class="config-field">
                    <label>Difficulty</label>
                    <select id="difficulty">
                        <option value="easy">Easy — Clear signals</option>
                        <option value="medium" selected>Medium — Realistic noise</option>
                        <option value="hard">Hard — Ambiguous cases</option>
                    </select>
                </div>
                <div class="config-field">
                    <label>Random Seed</label>
                    <input type="number" id="seed" value="" placeholder="Random">
                </div>
                <button class="btn btn-primary" id="btn-generate" onclick="generateTests()">Generate Test Events</button>
                <button class="btn btn-success" id="btn-run" onclick="runTests()" disabled>Run Agent Evaluation</button>
            </div>
        </div>

        <!-- Progress -->
        <div class="progress-panel" id="progress-panel">
            <h2>Test Progress</h2>
            <div class="progress-bar-track">
                <div class="progress-bar-fill" id="progress-fill" style="width: 0%">0%</div>
            </div>
            <div class="progress-status" id="progress-status">Waiting to start...</div>
        </div>

        <!-- Scores -->
        <div class="scores-panel" id="scores-panel">
            <h2>Evaluation Results</h2>
            <div class="scores-grid" id="scores-grid"></div>
            <h3 style="font-size:14px; color:var(--text-muted); margin-bottom:12px; text-align:center;">Confusion Matrix</h3>
            <div class="confusion-matrix" id="confusion-matrix"></div>
        </div>

        <!-- Generated Events / Results -->
        <div class="results-panel" id="results-panel" style="display:none">
            <h2 id="results-title">Generated Test Events</h2>
            <table class="results-table">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Event ID</th>
                        <th>Ground Truth</th>
                        <th>Description</th>
                        <th>Agent Says</th>
                        <th>Result</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="results-body"></tbody>
            </table>
        </div>
    </div>

    <!-- Detail Modal -->
    <div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
        <div class="modal" id="modal-content"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const BASE = window.location.pathname.replace(/\/test\/?$/, '');
        function apiUrl(path) { return BASE + path; }

        let testEvents = [];
        let testResults = [];
        let pollInterval = null;

        async function generateTests() {
            const numEvents = parseInt(document.getElementById('num-events').value) || 12;
            const difficulty = document.getElementById('difficulty').value;
            const seedVal = document.getElementById('seed').value;
            const seed = seedVal ? parseInt(seedVal) : null;

            document.getElementById('btn-generate').disabled = true;
            document.getElementById('btn-generate').textContent = 'Generating...';

            try {
                const res = await fetch(apiUrl('/api/test/generate'), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ num_events: numEvents, difficulty, seed }),
                });
                const data = await res.json();
                testEvents = data.events;
                testResults = [];
                renderEventsTable();
                document.getElementById('btn-run').disabled = false;
                document.getElementById('scores-panel').classList.remove('active');
                document.getElementById('progress-panel').classList.remove('active');
            } catch (e) {
                alert('Error generating tests: ' + e.message);
            }

            document.getElementById('btn-generate').disabled = false;
            document.getElementById('btn-generate').textContent = 'Generate Test Events';
        }

        function renderEventsTable() {
            const panel = document.getElementById('results-panel');
            panel.style.display = 'block';
            document.getElementById('results-title').textContent = `Generated Test Events (${testEvents.length})`;

            const tbody = document.getElementById('results-body');
            let html = '';
            for (const evt of testEvents) {
                const gtBadge = evt.ground_truth === 'leak'
                    ? '<span class="badge leak">Leak</span>'
                    : '<span class="badge false_positive">False Positive</span>';

                const result = testResults.find(r => r.event_id === evt.event_id);
                let agentBadge = '<span class="badge pending">Pending</span>';
                let resultBadge = '';
                let detailBtn = '';

                if (result) {
                    agentBadge = result.agent_classification === 'leak'
                        ? `<span class="badge leak">Leak</span>`
                        : result.agent_classification === 'error'
                        ? `<span class="badge error">Error</span>`
                        : `<span class="badge false_positive">False Positive</span>`;
                    resultBadge = result.correct
                        ? '<span class="badge correct">Correct</span>'
                        : '<span class="badge incorrect">Wrong</span>';
                    detailBtn = `<button class="btn btn-outline" style="padding:4px 10px;font-size:11px" onclick="showDetail('${evt.event_id}')">View</button>`;
                }

                html += `<tr class="${result ? (result.correct ? 'correct' : 'incorrect') : ''}">
                    <td>${evt.test_index}</td>
                    <td style="font-weight:600">${evt.event_id}</td>
                    <td>${gtBadge} <span style="font-size:11px;color:var(--text-muted)">${evt.severity}</span></td>
                    <td style="max-width:300px">${evt.description}</td>
                    <td>${agentBadge}</td>
                    <td>${resultBadge}</td>
                    <td>${detailBtn}</td>
                </tr>`;
            }
            tbody.innerHTML = html;
        }

        async function runTests() {
            document.getElementById('btn-run').disabled = true;
            document.getElementById('btn-generate').disabled = true;
            document.getElementById('progress-panel').classList.add('active');
            document.getElementById('scores-panel').classList.remove('active');

            try {
                await fetch(apiUrl('/api/test/run'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
                pollInterval = setInterval(pollStatus, 3000);
            } catch (e) {
                alert('Error starting tests: ' + e.message);
                document.getElementById('btn-run').disabled = false;
                document.getElementById('btn-generate').disabled = false;
            }
        }

        async function pollStatus() {
            try {
                const res = await fetch(apiUrl('/api/test/status'));
                const data = await res.json();

                const pct = data.total > 0 ? Math.round(100 * data.progress / data.total) : 0;
                document.getElementById('progress-fill').style.width = pct + '%';
                document.getElementById('progress-fill').textContent = pct + '%';
                document.getElementById('progress-status').textContent =
                    `Analyzing event ${data.progress} of ${data.total}... (${data.running ? 'running' : 'done'})`;

                if (data.results && data.results.length > 0) {
                    testResults = data.results;
                    renderEventsTable();
                }

                if (!data.running && data.progress >= data.total) {
                    clearInterval(pollInterval);
                    pollInterval = null;
                    document.getElementById('btn-run').disabled = false;
                    document.getElementById('btn-generate').disabled = false;
                    document.getElementById('progress-status').textContent = 'Evaluation complete!';

                    if (data.scores) {
                        renderScores(data.scores);
                    }
                }
            } catch (e) {
                console.error('Poll error:', e);
            }
        }

        function renderScores(scores) {
            const panel = document.getElementById('scores-panel');
            panel.classList.add('active');

            const accClass = scores.accuracy >= 0.9 ? 'good' : scores.accuracy >= 0.7 ? 'warn' : 'bad';
            const precClass = scores.precision >= 0.9 ? 'good' : scores.precision >= 0.7 ? 'warn' : 'bad';
            const recClass = scores.recall >= 0.9 ? 'good' : scores.recall >= 0.7 ? 'warn' : 'bad';
            const f1Class = scores.f1_score >= 0.9 ? 'good' : scores.f1_score >= 0.7 ? 'warn' : 'bad';

            document.getElementById('scores-grid').innerHTML = `
                <div class="score-card ${accClass}">
                    <div class="score-value">${(scores.accuracy * 100).toFixed(0)}%</div>
                    <div class="score-label">Accuracy</div>
                </div>
                <div class="score-card ${precClass}">
                    <div class="score-value">${(scores.precision * 100).toFixed(0)}%</div>
                    <div class="score-label">Precision</div>
                </div>
                <div class="score-card ${recClass}">
                    <div class="score-value">${(scores.recall * 100).toFixed(0)}%</div>
                    <div class="score-label">Recall</div>
                </div>
                <div class="score-card ${f1Class}">
                    <div class="score-value">${(scores.f1_score * 100).toFixed(0)}%</div>
                    <div class="score-label">F1 Score</div>
                </div>
                <div class="score-card neutral">
                    <div class="score-value">${scores.correct}/${scores.total}</div>
                    <div class="score-label">Correct</div>
                </div>
                <div class="score-card neutral">
                    <div class="score-value">${scores.true_leaks}</div>
                    <div class="score-label">True Leaks</div>
                </div>
            `;

            const cm = scores.confusion_matrix;
            document.getElementById('confusion-matrix').innerHTML = `
                <div></div>
                <div class="cm-header">Predicted Leak</div>
                <div class="cm-header">Predicted FP</div>
                <div class="cm-header" style="text-align:right">Actual Leak</div>
                <div class="cm-cell tp">${cm.tp}<span class="cm-label">True Pos</span></div>
                <div class="cm-cell fn">${cm.fn}<span class="cm-label">False Neg</span></div>
                <div class="cm-header" style="text-align:right">Actual FP</div>
                <div class="cm-cell fp">${cm.fp}<span class="cm-label">False Pos</span></div>
                <div class="cm-cell tn">${cm.tn}<span class="cm-label">True Neg</span></div>
            `;
        }

        function showDetail(eventId) {
            const result = testResults.find(r => r.event_id === eventId);
            if (!result) return;

            const modal = document.getElementById('modal-content');
            const isCorrect = result.correct;

            modal.innerHTML = `
                <h2>
                    ${result.event_id} — Agent Analysis
                    <button class="close-btn" onclick="closeModal()">&times;</button>
                </h2>
                <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px">
                    <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px">
                        <h3 style="font-size:12px;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase">Ground Truth</h3>
                        <div class="detail-row"><span class="detail-label">Classification:</span><span class="detail-value">${result.ground_truth}</span></div>
                        <div class="detail-row"><span class="detail-label">Severity:</span><span class="detail-value">${result.ground_truth_severity}</span></div>
                        <div class="detail-row"><span class="detail-label">Description:</span><span class="detail-value">${result.description}</span></div>
                    </div>
                    <div style="background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:14px">
                        <h3 style="font-size:12px;color:var(--text-muted);margin-bottom:8px;text-transform:uppercase">Agent Classification</h3>
                        <div class="detail-row"><span class="detail-label">Classification:</span><span class="detail-value">${result.agent_classification}</span></div>
                        <div class="detail-row"><span class="detail-label">Severity:</span><span class="detail-value">${result.agent_severity}</span></div>
                        <div class="detail-row"><span class="detail-label">Confidence:</span><span class="detail-value">${(result.agent_confidence * 100).toFixed(0)}%</span></div>
                        <div class="detail-row"><span class="detail-label">Action:</span><span class="detail-value">${result.agent_action}</span></div>
                        <div class="detail-row"><span class="detail-label">Result:</span><span class="badge ${isCorrect ? 'correct' : 'incorrect'}">${isCorrect ? 'Correct' : 'Incorrect'}</span></div>
                    </div>
                </div>
                <h3 style="font-size:13px;color:var(--accent);margin-bottom:8px;text-transform:uppercase">Full Agent Response</h3>
                <div class="response-block">${typeof marked !== 'undefined' ? marked.parse(result.full_response) : escapeHtml(result.full_response)}</div>
            `;
            document.getElementById('modal-overlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('active');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
